name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC x64)
        shell: cmd
        run: build.bat

      - name: Smoke test
        shell: pwsh
        run: |
          .\gprimes64.exe -q 1000000
          .\gprimes64.exe -m miller -q 1000000
          .\gprimes64.exe -c 100 | Select-Object -Last 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gprimes64-exe
          path: gprimes64.exe
